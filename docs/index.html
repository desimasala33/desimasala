<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desi Masala – Video Streaming</title>

<style>
body {
    background: #111;
    color: white;
    font-family: Arial;
    margin: 0;
}

header {
    background: #222;
    padding: 20px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
}

.grid {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
    padding: 20px;
}

.card {
    background: #1e1e1e;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s;
}

.card img {
    width: 100%;
    height: 240px;
    object-fit: cover;
}

.card:hover {
    transform: scale(1.05);
}

.card-title {
    padding: 10px;
    text-align: center;
}
</style>
</head>

<body>

<header>🎬 Desi Masala – Video Streaming</header>

<div class="grid">

    <a class="card" href="video1.html">
        <img src="https://via.placeholder.com/300x200?text=Video+1">
        <div class="card-title">Sample Video 1</div>
    </a>

    <a class="card" href="video2.html">
        <img src="https://via.placeholder.com/300x200?text=Video+2">
        <div class="card-title">Sample Video 2</div>
    </a>

    <a class="card" href="video3.html">
        <img src="https://via.placeholder.com/300x200?text=Video+3">
        <div class="card-title">Sample Video 3</div>
    </a>

</div>

</body>
</html>
